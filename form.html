<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AJUKAN</title>

<link rel="stylesheet"
href="form.css">

</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo-wrap">

        <img
        src="assets/logo-danaa.png"
        class="logo">

    </div>

    <!-- TITLE -->
    <div class="title">

        Masukan
        <b>NOMOR HP</b>
        kamu untuk lanjut

    </div>

    <!-- INPUT BOX -->
<div class="phone-row">

    <div class="field-wrap country-wrap">
        <div class="field-label">Negara</div>

        <div class="country-card">
            <img src="assets/flag-id.png" class="flag">
            <span>+62</span>
        </div>
    </div>

    <div class="field-wrap number-wrap">
        <div class="field-label">Nomor</div>

        <div class="number-card">
            <input
            type="tel"
            id="phone"
            autocomplete="off"
            placeholder="812-3456-7890">

            <div class="clear-btn" id="clearBtn"></div>
        </div>
    </div>

</div>

    <!-- ERROR -->
    <div
    class="error-box"
    id="errorBox">

        Pastikan Nomor yang
        kamu masukan benar

    </div>

    <!-- DESC -->
    <div class="desc">

        Dengan melanjutkan,
        kamu setuju dengan
        <b>Syarat & Ketentuan</b>
        serta
        <b>Pemberitahuan Privasi</b>
        kami

    </div>

    <!-- BUTTON -->
    <button
    class="btn"
    id="lanjutBtn">

        LANJUTKAN

    </button>

</div>

<script src="form.js"></script>

</body>
</html>
